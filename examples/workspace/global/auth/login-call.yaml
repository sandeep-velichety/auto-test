# A token from a custom HTTP call: you describe the request, and say where
# the token is in the response and how to send it.
id: login-call
name: Token from a custom login call
type: http_call
httpCall:
  method: POST
  url: "{{sample-config.baseUrl}}/auth/login"
  headers:
    X-Client-Id: demo-client
  body:
    username: qa-user
    password: qa-password          # real setups: "{{$env.QA_PASSWORD}}"
  tokenPath: data.session.token    # where the token is in the JSON response
  headerName: Authorization        # header that carries it on each test request
  prefix: Bearer                   # "none" sends the bare token
