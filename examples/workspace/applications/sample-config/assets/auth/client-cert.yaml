# Mutual TLS: the test client proves who it is with a certificate.
# The three files live next to this profile in ../certs.
id: client-cert
name: Client certificate (mutual TLS)
type: mtls
tls:
  cert: demo-client.crt     # client certificate, PEM (required)
  key: demo-client.key      # its private key, unencrypted PEM (required)
  ca: demo-ca.crt           # CA that signed the SERVER's certificate (only for a private CA)
  # serverName: orders.internal    # when the certificate name differs from the host you call
