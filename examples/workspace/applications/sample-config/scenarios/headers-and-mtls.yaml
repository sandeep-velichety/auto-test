id: headers-and-mtls
name: HTTP headers and gRPC metadata over mutual TLS
description: Each test chooses its auth and whether mutual TLS is needed. HTTP with headers, three ways of getting a token, and gRPC with metadata, each with negative cases.
tags: [sample]
variables:
  requestId: "req-{{$uuid}}"          # set once, reused by every step
tests:
  # ---- HTTP with headers; the certificate is chosen automatically by host ----
  - id: http-with-headers
    name: HTTP call with headers over mutual TLS
    type: http
    auth: tenant-headers                    # sends X-Tenant and X-Api-Key
    # no "mtls:" line: the "client" certificate set lists this host, so it is used
    http:
      method: GET
      url: "{{secureUrl}}/secure/echo"
      headers:
        X-Request-Id: "{{requestId}}"
        Accept: application/json
      query:
        verbose: "true"
    expect:
      status: 200
      headers:                              # response headers
        X-Request-Id: "{{requestId}}"
      body:
        - path: client                      # who the server saw in the certificate
          value: testplane-demo-client
        - path: headers.X-Tenant
          value: "{{tenant}}"
        - path: headers.X-Api-Key
          value: demo-key
    variants:
      - id: missing-tenant-header
        name: Rejected without the X-Tenant header
        http:
          headers:
            X-Tenant: ""                    # an empty value removes a header, even one from the auth profile
        expect:
          status: 400
          body:
            - path: error
              op: contains
              value: X-Tenant
      - id: no-client-certificate
        name: TLS handshake refused without a client certificate
        mtls: trust-only                    # trusts the CA, presents nothing
        expect:
          error: "*"                        # the call fails before any response; the exact message varies

  # ---- Token from an identity provider (OAuth2), sent as a bearer token ----
  - id: http-with-idp-token
    name: HTTP call with a token from the identity provider
    type: http
    auth: oauth-client
    http:
      method: POST
      url: "{{baseUrl}}/orders"
      headers:
        X-Request-Id: "{{requestId}}"
      body:
        item: sample
        quantity: 1
    expect:
      status: 201
    capture:
      orderId: id
    variants:
      - id: token-overridden
        name: Rejected when the step overrides the Authorization header
        http:
          headers:
            Authorization: Bearer not-a-real-token   # step headers win over the profile's
        expect:
          status: 401

  # ---- Token from a custom HTTP call ----
  - id: http-with-login-call
    name: HTTP call with a token from a custom login call
    type: http
    auth: login-call
    http:
      method: GET
      url: "{{baseUrl}}/orders/{{orderId}}"
    expect:
      status: 200
      body:
        - path: item
          value: sample

  # ---- gRPC with metadata; mutual TLS chosen explicitly on the test ----
  - id: grpc-with-metadata
    name: gRPC call with metadata over mutual TLS
    type: grpc
    auth: tenant-headers                    # X-Tenant and X-Api-Key become metadata
    mtls: client                            # mutual TLS is needed: present this certificate set
    grpc:
      target: "{{grpcSecureTarget}}"
      method: grpc.health.v1.Health/Check
      # plaintext is left out, so TLS is used
      metadata:                             # gRPC's headers, added to the profile's
        x-request-id: "{{requestId}}"
      message:
        service: orders
      # protoFiles: [orders.proto]          # from assets/protos; omit to use server reflection
    expect:
      code: OK
      body:
        - path: status
          value: SERVING
    variants:
      - id: missing-tenant-metadata
        name: Rejected without x-tenant metadata
        auth: none
        expect:
          code: INVALID_ARGUMENT
      - id: unknown-service
        name: Unknown service is NOT_FOUND
        grpc:
          message:
            service: no-such-service
        expect:
          code: NOT_FOUND
      - id: no-client-certificate
        name: Connection refused without a client certificate
        mtls: trust-only
        expect:
          error: "*"                        # any failure; the exact gRPC message varies
